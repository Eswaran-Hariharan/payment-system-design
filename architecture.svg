<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a6572"/></marker>
    <marker id="arD" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9333ea"/></marker>
    <style>
      .lbl { font-size: 11px; fill: #5a6572; }
      .box-t { font-size: 13px; font-weight: 700; }
      .sub { font-size: 10px; fill: #5a6572; }
    </style>
  </defs>
  <rect width="1180" height="720" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Payment System — High-Level Architecture</text>

  <!-- Client / IFRAME -->
  <rect x="30" y="300" width="110" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="330" text-anchor="middle" class="box-t" fill="#334155">Client</text>
  <text x="85" y="348" text-anchor="middle" class="sub">IFRAME —</text>
  <text x="85" y="361" text-anchor="middle" class="sub">payment options</text>

  <!-- API Gateway -->
  <rect x="190" y="298" width="95" height="74" rx="10" fill="#fde2e4" stroke="#e11d48"/>
  <text x="237" y="328" text-anchor="middle" class="box-t" fill="#be123c">API</text>
  <text x="237" y="345" text-anchor="middle" class="box-t" fill="#be123c">Gateway</text>
  <text x="237" y="362" text-anchor="middle" class="sub">auth · rate limit</text>

  <!-- Payment Service -->
  <rect x="340" y="288" width="130" height="96" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="405" y="314" text-anchor="middle" class="box-t" fill="#b45309">Payment Service</text>
  <text x="405" y="334" text-anchor="middle" class="sub">createPayment</text>
  <text x="405" y="349" text-anchor="middle" class="sub">updateStatus</text>
  <text x="405" y="366" text-anchor="middle" class="sub">idempotency key</text>

  <!-- Redis -->
  <ellipse cx="520" cy="250" rx="52" ry="24" fill="#fee2e2" stroke="#ef4444"/>
  <text x="520" y="248" text-anchor="middle" class="sub" font-weight="700" fill="#b91c1c">Redis</text>
  <text x="520" y="262" text-anchor="middle" class="sub">idempotency key</text>

  <!-- SQL + Outbox (transaction box) -->
  <rect x="470" y="60" width="210" height="150" rx="10" fill="none" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="575" y="52" text-anchor="middle" class="sub">single DB transaction</text>
  <rect x="490" y="78" width="80" height="54" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="530" y="100" text-anchor="middle" class="sub" font-weight="700" fill="#15803d">Outbox</text>
  <text x="530" y="114" text-anchor="middle" class="sub" fill="#15803d">Table</text>
  <rect x="490" y="142" width="170" height="52" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="575" y="164" text-anchor="middle" class="sub" font-weight="700" fill="#15803d">SQL Database</text>
  <text x="575" y="180" text-anchor="middle" class="sub" fill="#15803d">paymentId · status · amount</text>

  <!-- CDC Debezium -->
  <text x="730" y="118" text-anchor="middle" class="sub" font-weight="700" fill="#9333ea">CDC</text>
  <text x="730" y="132" text-anchor="middle" class="sub" fill="#9333ea">Debezium</text>

  <!-- Kafka -->
  <rect x="800" y="60" width="130" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="865" y="84" text-anchor="middle" class="box-t" fill="#6d28d9">KAFKA</text>
  <rect x="818" y="96" width="94" height="30" rx="6" fill="#fff" stroke="#a78bfa"/>
  <text x="865" y="116" text-anchor="middle" class="sub">paymentEvent</text>
  <rect x="818" y="134" width="94" height="30" rx="6" fill="#fff" stroke="#a78bfa"/>
  <text x="865" y="154" text-anchor="middle" class="sub">paymentEvent</text>

  <!-- Analytics / Inventory -->
  <rect x="960" y="70" width="80" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1000" y="97" text-anchor="middle" class="sub" font-weight="700" fill="#334155">Analytics</text>
  <rect x="960" y="128" width="80" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1000" y="155" text-anchor="middle" class="sub" font-weight="700" fill="#334155">Inventory</text>

  <!-- Payment Orchestrator -->
  <rect x="640" y="280" width="150" height="110" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="715" y="304" text-anchor="middle" class="box-t" fill="#b45309">Payment</text>
  <text x="715" y="320" text-anchor="middle" class="box-t" fill="#b45309">Orchestrator</text>
  <rect x="655" y="330" width="120" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="715" y="350" text-anchor="middle" class="sub" fill="#1d4ed8">Payment Gateway</text>
  <text x="715" y="378" text-anchor="middle" class="sub">redirect · status</text>

  <!-- Bank transaction -->
  <rect x="870" y="270" width="150" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="945" y="296" text-anchor="middle" class="box-t" fill="#15803d">Bank Transaction</text>
  <text x="945" y="322" text-anchor="middle" class="sub" fill="#166534">debit from user's</text>
  <text x="945" y="338" text-anchor="middle" class="sub" fill="#166534">account, credit to</text>
  <text x="945" y="354" text-anchor="middle" class="sub" fill="#166534">merchant's account</text>

  <!-- Webhook handler -->
  <rect x="640" y="470" width="160" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="720" y="496" text-anchor="middle" class="box-t" fill="#1d4ed8">Webhook Handler</text>
  <text x="720" y="518" text-anchor="middle" class="sub" fill="#1e40af">keeps system idempotent</text>
  <text x="720" y="536" text-anchor="middle" class="sub" fill="#1e40af">bank ⇄ payment service</text>
  <text x="720" y="552" text-anchor="middle" class="sub" fill="#1e40af">status updates</text>

  <!-- Reconciliation workers -->
  <circle cx="945" cy="520" r="62" fill="#f1f5f9" stroke="#64748b"/>
  <text x="945" y="512" text-anchor="middle" class="sub" font-weight="700" fill="#334155">Reconciliation</text>
  <text x="945" y="528" text-anchor="middle" class="sub" font-weight="700" fill="#334155">Workers</text>
  <text x="945" y="546" text-anchor="middle" class="sub" fill="#475569">for payment failures</text>

  <!-- Webhook -> merchant -->
  <rect x="250" y="470" width="150" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="325" y="498" text-anchor="middle" class="box-t" fill="#1d4ed8">Webhook Handler</text>
  <text x="325" y="518" text-anchor="middle" class="sub" fill="#1e40af">bidirectional link:</text>
  <text x="325" y="534" text-anchor="middle" class="sub" fill="#1e40af">service ⇄ merchant</text>
  <rect x="80" y="478" width="90" height="64" rx="10" fill="#fef08a" stroke="#ca8a04"/>
  <text x="125" y="506" text-anchor="middle" class="sub" font-weight="700" fill="#a16207">Payment</text>
  <text x="125" y="522" text-anchor="middle" class="sub" font-weight="700" fill="#a16207">merchant</text>

  <!-- ===== arrows ===== -->
  <!-- client -> api -->
  <line x1="140" y1="333" x2="188" y2="333" stroke="#5a6572" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- api -> payment service -->
  <line x1="285" y1="333" x2="338" y2="333" stroke="#5a6572" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="312" y="326" text-anchor="middle" class="lbl">payNow</text>
  <!-- payment service -> redis -->
  <line x1="450" y1="300" x2="500" y2="268" stroke="#5a6572" stroke-width="1.3" marker-end="url(#ar)"/>
  <!-- payment service -> SQL -->
  <line x1="470" y1="310" x2="560" y2="196" stroke="#5a6572" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="520" y="236" text-anchor="middle" class="lbl">write txn</text>
  <!-- SQL -> Debezium -> Kafka -->
  <line x1="660" y1="150" x2="706" y2="130" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arD)"/>
  <line x1="756" y1="122" x2="798" y2="120" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arD)"/>
  <!-- Outbox used by debezium (dashed) -->
  <line x1="570" y1="100" x2="706" y2="118" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arD)"/>
  <!-- Kafka -> analytics / inventory -->
  <line x1="930" y1="110" x2="958" y2="92" stroke="#5a6572" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="930" y1="140" x2="958" y2="150" stroke="#5a6572" stroke-width="1.4" marker-end="url(#ar)"/>
  <!-- payment service -> orchestrator -->
  <line x1="470" y1="345" x2="638" y2="340" stroke="#5a6572" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- orchestrator -> bank -->
  <line x1="790" y1="330" x2="868" y2="330" stroke="#5a6572" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="830" y="322" text-anchor="middle" class="lbl">authorize</text>
  <!-- bank -> webhook handler -->
  <line x1="900" y1="400" x2="790" y2="478" stroke="#5a6572" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="865" y="448" text-anchor="middle" class="lbl">status</text>
  <!-- webhook -> payment service (update status) -->
  <path d="M640,500 C 520,480 460,440 420,386" fill="none" stroke="#5a6572" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="560" y="452" text-anchor="middle" class="lbl">update payment status</text>
  <!-- reconciliation -> bank -->
  <path d="M945,458 C 945,430 945,415 945,402" fill="none" stroke="#5a6572" stroke-width="1.4" marker-end="url(#ar)"/>
  <!-- reconciliation loop arrow -->
  <path d="M1005,500 C 1060,470 1060,560 1000,555" fill="none" stroke="#5a6572" stroke-width="1.3" marker-end="url(#ar)"/>
  <!-- payment service <-> merchant webhook -->
  <path d="M340,360 C 260,410 325,440 325,468" fill="none" stroke="#5a6572" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="248" y1="510" x2="172" y2="510" stroke="#5a6572" stroke-width="1.4" marker-end="url(#ar)"/>
  <!-- client load page -->
  <path d="M85,370 C 85,430 320,430 338,368" fill="none" stroke="#5a6572" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="230" y="424" text-anchor="middle" class="lbl">load page with payment options</text>
</svg>
